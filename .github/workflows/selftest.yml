name: Selftest news http
on: { push: { paths: ['.selftest/**', '.github/workflows/selftest.yml'] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10' }
      - run: |
          mkdir -p .selftest/src/main/java/fr/spartacube/badge
          cp plugin/src/main/java/fr/spartacube/badge/NewsApi.java plugin/src/main/java/fr/spartacube/badge/SharedPortHttp.java .selftest/src/main/java/fr/spartacube/badge/
          cd .selftest && gradle -q run 2>&1 | tee out.txt
          tail -n 12 out.txt | tr '\n' '~' | sed 's/^/::notice::/'; echo
