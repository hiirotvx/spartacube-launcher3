# Compile le launcher pour Windows, macOS et Linux et publie une Release GitHub.
#
# Déclencheurs :
#  - push sur main qui modifie package.json : si la "version" n'a pas encore
#    de Release (tag vX.Y.Z), elle est compilée et publiée automatiquement ;
#  - bouton "Run workflow" (manuel).
# Les launchers déjà installés se mettent alors à jour tout seuls.
name: Build & Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "La version v$VERSION existe déjà : rien à publier."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version v$VERSION : compilation."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  mod:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/mod.yml

  build:
    needs: [check, mod]
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mod-dist
          path: mod-dist
      - run: npm run check
      - name: Build & publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature (optionnel mais recommandé) — à ajouter dans Settings > Secrets :
          # CSC_LINK / CSC_KEY_PASSWORD (Windows ou macOS)
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarisation macOS)
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

  plugin-asset:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-plugin
      - name: Joindre le plugin serveur à la Release
        run: gh release upload "v${{ needs.check.outputs.version }}" SpartaCubeBadge.jar --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
