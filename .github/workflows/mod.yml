# Compile le mod Fabric "SpartaCube Client" à chaque modification de mod/.
# Le jar est ensuite intégré au launcher par le workflow Build & Release.
name: Mod SpartaCube Client

on:
  push:
    branches: [main]
    paths: ['mod/**', 'plugin/**', '.github/workflows/mod.yml', '.github/scripts/gradle-annotate.sh']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Compiler le mod
        run: bash .github/scripts/gradle-annotate.sh
      - name: Compiler le plugin serveur
        run: bash .github/scripts/gradle-annotate.sh plugin
      - uses: actions/upload-artifact@v4
        with:
          name: server-plugin
          path: plugin/build/libs/SpartaCubeBadge.jar
      - name: Préparer mod-dist
        run: |
          mkdir -p mod-dist
          JAR=$(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" mod-dist/spartacube-client.jar
          MC=$(grep '^minecraft_version=' mod/gradle.properties | cut -d= -f2)
          echo "{\"minecraft\":\"$MC\",\"files\":[\"spartacube-client.jar\"]}" > mod-dist/bundled.json
          ls -la mod-dist
      - uses: actions/upload-artifact@v4
        with:
          name: mod-dist
          path: mod-dist/
