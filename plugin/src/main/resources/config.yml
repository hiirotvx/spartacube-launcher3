# Cosmétiques exclusifs au launcher SpartaCube.
# Accès par UUID ou pseudo ci-dessous, OU par permission :
#   spartacube.cosmetic.wings  (ailes de feu)
#   spartacube.cosmetic.aura   (aura de flammes)
# Après modification : redémarrer le serveur (ou /reload confirm).
cosmetics:
  wings:
    - 6eb277d7-48c3-41c8-a3ba-bf5339f59cd4   # Hiirowh
    - Hiirowh
  aura:
    - 6eb277d7-48c3-41c8-a3ba-bf5339f59cd4   # Hiirowh
    - Hiirowh

# Admins du launcher : peuvent publier les actualités depuis le launcher (UUID avec tirets).
# La vérification passe par la connexion Microsoft/Mojang : impossible d'usurper un UUID.
admins:
  - 6eb277d7-48c3-41c8-a3ba-bf5339f59cd4   # Hiirowh

# API des actualités lue par le launcher.
#   mode: minecraft -> sur le port du serveur Minecraft (rien à ouvrir, serveur Paper requis)
#   mode: port      -> sur un port dédié (port ci-dessous, à ouvrir en TCP chez l'hébergeur)
news-api:
  enabled: true
  mode: minecraft
  bind: 0.0.0.0
  port: 8765
